# $schema: "https://github.com/compose-spec/compose-spec/blob/master/schema/compose-spec.json"
services:
  mongo:
    image: mongo:8.3
    # SERVER-121912: mongod refuses to start on Linux kernels 6.19.0 to 7.0.13 when tcmalloc
    # per-CPU caches are active. rseq=1 lets glibc register rseq first, so tcmalloc falls back
    # to per-thread caches (slower, fine for tests) and the startup check passes.
    environment:
      GLIBC_TUNABLES: glibc.pthread.rseq=1
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 5
  app:
    build: .
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DEBUG=${DEBUG:-true}
      - MONGODB_URL=${MONGODB_URL:-mongodb://mongo:27017/blogging}
    depends_on:
      mongo:
        condition: service_healthy
      tests:
        condition: service_completed_successfully
  tests:
    build:
      context: .
      dockerfile: Dockerfile.tests
    environment:
      - COVERAGE_THRESHOLD=${COVERAGE_THRESHOLD:-80}
      - MONGODB_URL=${MONGODB_URL:-mongodb://mongo:27017/blogging}
    depends_on:
      mongo:
        condition: service_healthy
